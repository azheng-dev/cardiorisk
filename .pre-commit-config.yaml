# Pre-commit hooks. Run `pre-commit install` once after clone.
# Order matters: cheapest checks first, secret scan last so it always runs.
#
# Note on Python version: hooks run inside their own pre-commit-managed venvs
# and only need any modern Python 3 to bootstrap. The actual project Python
# version (3.12) is enforced separately in backend/pyproject.toml and CI.
default_language_version:
  python: python3

repos:
  # --- Generic hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # --- Python: Ruff (lint + format) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # --- Python: mypy (runs through the project venv) ---
  # Using the local hook + uv ensures mypy sees the *exact* dependency set
  # declared in backend/pyproject.toml (pandas-stubs, types-requests, pytest,
  # etc.) instead of a hand-curated additional_dependencies list that drifts.
  # CI uses `uv run mypy .` from backend/; this hook does the same.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, strict)
        entry: bash -c 'cd backend && uv run --frozen mypy .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # --- TS / JS: Biome (lint + format) ---
  # Biome 1.x resolves biome.json from the *current working directory*, not from
  # each input file's directory. The pre-commit hook runs from repo root, so we
  # must pass --config-path=frontend explicitly or it silently falls back to
  # tab-indent defaults and rewrites every frontend file. See ADR-007.
  - repo: https://github.com/biomejs/pre-commit
    rev: v1.9.4
    hooks:
      - id: biome-check
        files: ^frontend/
        args: ["--config-path=frontend"]
        additional_dependencies: ["@biomejs/biome@1.9.4"]

  # --- Notebooks: strip outputs before commit ---
  # Notebooks are paired with .py (jupytext percent format) under notebooks/.
  # The .py file is the diff-able source of truth; the .ipynb is regenerated by
  # `jupytext --sync`. Outputs are stripped so commits don't carry rendered
  # plots / dataset stats and PR diffs stay readable.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # --- Custom: block raw data CSVs from being staged ---
  - repo: local
    hooks:
      - id: no-raw-data
        name: block raw data files
        description: |
          Refuses to commit files under data/raw/ or any *.csv outside fixtures/.
          Raw data (especially anything resembling clinical data) must never enter
          the public repo. Use a download script and store data in data/raw/ locally.
        entry: scripts/no_raw_data.sh
        language: script
        pass_filenames: true

  # --- Secret scanning (last so it always runs even if earlier hooks fail) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
