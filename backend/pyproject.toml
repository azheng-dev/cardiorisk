[project]
name = "cardiorisk-backend"
version = "0.0.0"
description = "FastAPI backend, ML models, and agentic orchestration for CardioRisk Co-Pilot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "CardioRisk Co-Pilot contributors" }]

# Deps grow per-phase. Phase 2.1 added data + EDA. Phase 2.2 adds scikit-learn
# for the preprocessing pipeline (IterativeImputer / OneHotEncoder /
# Pipeline / ColumnTransformer / LeaveOneGroupOut). Future phases:
# fastapi/pydantic in Phase 4, langgraph in Phase 4, shap in Phase 2.5,
# tabpfn / xgboost in Phase 2.3.
dependencies = [
    # data + I/O
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "pyarrow>=24.0.0",
    "requests>=2.33.1",
    # notebook + viz (Phase 2.1 EDA)
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "missingno>=0.5.2",
    "ipykernel>=7.2.0",
    "jupytext>=1.19.1",
    "nbconvert>=7.17.1",
    # optional dataset source: Kaggle HFP cross-check (UCI is primary)
    "kaggle>=2.1.0",
    # preprocessing pipeline (Phase 2.2): pipelines, splitters, IterativeImputer
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.14",
  "mypy>=1.18",
  # type stubs for the Phase 2.1 stack
  "pandas-stubs>=3.0",
  "types-requests>=2.33",
  # strips notebook outputs at commit time (paired with jupytext .py source)
  "nbstripout>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardiorisk"]

# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Strict-ish defaults. Add rules as the codebase grows.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts and have less strict naming. N806 covers tests
# of sklearn-shaped APIs that bind X = ... in helper bodies.
"tests/**" = ["S101", "N802", "N803", "N806"]
# CLI scripts: stdlib `random` is fine for deterministic synthetic-data
# generation; T201 (print) is fine in a script that prints status to stdout.
"scripts/**" = ["S311", "T201"]
# Sklearn convention uses uppercase X for the feature matrix; we follow it
# in custom transformers and pipeline factories so the API matches what
# users expect from sklearn estimators.
"cardiorisk/features/**" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
plugins = []

[[tool.mypy.overrides]]
# Test code can be a touch looser; we still want types but not strict-mode purity.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party libs without type stubs. Scoped to the modules where typing
# is genuinely missing upstream; drop a line if the package gains stubs.
module = [
  # Phase 2.1: notebook stack + Kaggle
  "missingno", "missingno.*",
  "kaggle", "kaggle.*",
  # Phase 2.2: scikit-learn ships no py.typed marker as of 1.8
  "sklearn", "sklearn.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = [
  "error",
  # IterativeImputer's "Early stopping criterion not reached" at small n
  # (our LODO folds are 600-800 rows) is expected behaviour, not a bug.
  # The imputer still produces sensible imputations; convergence is a
  # nice-to-have, not a correctness condition. Suppressed only for this
  # specific class so any *other* sklearn warning still fails tests.
  "ignore:\\[IterativeImputer\\] Early stopping criterion not reached:sklearn.exceptions.ConvergenceWarning",
]

# ------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["cardiorisk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
