[project]
name = "cardiorisk-backend"
version = "0.0.0"
description = "FastAPI backend, ML models, and agentic orchestration for CardioRisk Co-Pilot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "CardioRisk Co-Pilot contributors" }]

# Deps grow per-phase. Phase 2.1 added data + EDA. Phase 2.2 adds scikit-learn
# for the preprocessing pipeline. Phase 2.3a added no new deps (eval harness
# is pure sklearn + numpy + matplotlib). Phase 2.3b adds tabpfn (TFM headline),
# xgboost (white-box workhorse), optuna (Bayesian hyperparam search). Phase
# 2.4 adds no new deps (Honours-Ensemble PyTorch port reuses torch transitively
# via tabicl). Phase 2.5 adds shap (SHAP / KernelExplainer / TreeExplainer).
# Future phases: fastapi/pydantic in Phase 4, langgraph in Phase 4.
dependencies = [
    # data + I/O
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "pyarrow>=24.0.0",
    "requests>=2.33.1",
    # notebook + viz (Phase 2.1 EDA)
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "missingno>=0.5.2",
    "ipykernel>=7.2.0",
    "jupytext>=1.19.1",
    "nbconvert>=7.17.1",
    # optional dataset source: Kaggle HFP cross-check (UCI is primary)
    "kaggle>=2.1.0",
    # preprocessing pipeline (Phase 2.2): pipelines, splitters, IterativeImputer
    "scikit-learn>=1.8.0",
    # v1 risk model (Phase 2.3b): TFM headline + XGBoost workhorse + Optuna tuner.
    # joblib is already pulled transitively by sklearn; we list it explicitly because
    # the model artefact storage layer depends on it directly (ADR-010).
    #
    # TFM choice: ADR-006 specified TabPFN. By Phase 2.3b implementation, TabPFN's
    # 7.x line had added a PriorLabs license + TABPFN_TOKEN gate for model weight
    # download, which breaks the no-auth reproducibility commitment of ADR-010.
    # TabPFN 2.x is incompatible with scikit-learn 1.8. ADR-011 supersedes ADR-006
    # on this point and substitutes TabICL (Inria Soda team, BSD-3, freely
    # distributable, same in-context-learning TFM family).
    "tabicl>=2.1,<2.2",
    "xgboost>=3.0",
    "optuna>=4.4",
    "joblib>=1.5",
    # Phase 2.5 explainability: KernelExplainer (model-agnostic, used as the
    # cross-model headline) + TreeExplainer (XGBoost native sanity-check).
    # ADR-013. MIT-licensed. Pulls numba + cloudpickle + slicer transitively.
    "shap>=0.51,<0.52",
    # Phase 3.1 corpus ingestion (ADR-015). All MIT-licensed.
    #   pdfplumber - PDF text extraction with per-page char offsets
    #   tiktoken   - cl100k_base BPE for the token-window chunker
    #   jsonschema - validates eval/retrieval/questions.jsonl in CI
    # spaCy is intentionally NOT added: the Phase 3.1 semantic chunker uses
    # a regex sentence splitter to keep the dep footprint small. spaCy
    # graduates if Phase 3.2's retrieval eval shows the regex splitter is
    # the limiting factor.
    "pdfplumber>=0.11,<0.13",
    "tiktoken>=0.8,<0.10",
    "jsonschema>=4.23,<5",
    # Phase 3.2 retrieval stack (ADR-016). All MIT / Apache-2.0 / BSD-3.
    #   hnswlib              - in-memory HNSW vector index (graduates to
    #                          pgvector in Phase 4 behind the same interface)
    #   rank-bm25            - BM25Okapi sparse leg of the hybrid retriever
    #   sentence-transformers- bge-m3 dense embedder (and the MiniLM-L6
    #                          CI-smoke embedder); also pulled by
    #                          FlagEmbedding transitively
    #   FlagEmbedding        - canonical bge-m3 + bge-reranker-v2-m3 wrappers
    "hnswlib>=0.8,<0.9",
    "rank-bm25>=0.2,<0.3",
    "sentence-transformers>=3.2,<6.0",
    "FlagEmbedding>=1.3,<2",
    # Phase 4 agentic stack (ADR-018). All MIT / BSD / Apache-2.0.
    #   langgraph         - StateGraph + interrupt/resume primitives
    #                       (HITL pattern). 0.6 line locks the
    #                       checkpointer + interrupt API we wire to.
    #   langgraph-checkpoint
    #                     - in-memory MemorySaver checkpointer; deferred
    #                       Postgres checkpointer comes with Phase 8.
    #   fastapi           - HTTP surface for the agent graph
    #   uvicorn[standard] - ASGI dev server + websockets/h2/uvloop extras
    #                       (only used by `serve_api.py`; not imported
    #                       in the test path)
    #   pydantic-settings - env-var-driven config (AGENTS §5)
    #   tenacity          - retries + backoff for the LLM/NLI hot path
    #   httpx             - FastAPI's TestClient transport (test-only
    #                       runtime path; the dev group below pins it)
    "langgraph>=0.6,<0.7",
    "langgraph-checkpoint>=2.1,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "tenacity>=9.0,<11",
    "httpx>=0.28,<1",
    # Phase 6 LLM stack (ADR-019, free-tier-only per ADR-024).
    #   google-genai - Google AI Studio SDK (gemini-2.5-flash).
    #                  Free tier per https://ai.google.dev/pricing.
    #   openai       - reused for the Groq client (Groq exposes an
    #                  OpenAI-compatible /v1 surface).
    # No paid clients (anthropic, native openai) are listed: callers
    # who already pay can `pip install anthropic openai` separately.
    "google-genai>=1.0,<3",
    "openai>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.14",
  "mypy>=1.18",
  # type stubs for the Phase 2.1 stack
  "pandas-stubs>=3.0",
  "types-requests>=2.33",
  # strips notebook outputs at commit time (paired with jupytext .py source)
  "nbstripout>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardiorisk"]

# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Strict-ish defaults. Add rules as the codebase grows.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts and have less strict naming. N806 covers tests
# of sklearn-shaped APIs that bind X = ... in helper bodies.
"tests/**" = ["S101", "N802", "N803", "N806"]
# CLI scripts: stdlib `random` is fine for deterministic synthetic-data
# generation; T201 (print) is fine in a script that prints status to stdout.
# N803/N806 because Phase 2.6 scripts (build_reference.py) bind the
# sklearn-convention uppercase X for feature matrices in driver bodies.
"scripts/**" = ["S311", "T201", "N803", "N806"]
# Sklearn convention uses uppercase X for the feature matrix; we follow it
# in custom transformers, pipeline factories, calibration wrappers, model
# wrappers, and anywhere else that mirrors an sklearn estimator API.
"cardiorisk/features/**" = ["N803", "N806"]
"cardiorisk/calibration.py" = ["N803", "N806"]
"cardiorisk/models/**" = ["N803", "N806"]
"cardiorisk/eval/**" = ["N803", "N806"]
"cardiorisk/training/**" = ["N803", "N806"]
"cardiorisk/explainability/**" = ["N803", "N806"]
"cardiorisk/monitoring/**" = ["N803", "N806"]
"cardiorisk/rag/**" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
plugins = []

[[tool.mypy.overrides]]
# Test code can be a touch looser; we still want types but not strict-mode purity.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party libs without type stubs. Scoped to the modules where typing
# is genuinely missing upstream; drop a line if the package gains stubs.
module = [
  # Phase 2.1: notebook stack + Kaggle
  "missingno", "missingno.*",
  "kaggle", "kaggle.*",
  # Phase 2.2: scikit-learn ships no py.typed marker as of 1.8
  "sklearn", "sklearn.*",
  # Phase 2.3b: TabICL / XGBoost / Optuna / joblib all without py.typed
  "tabicl", "tabicl.*",
  "xgboost", "xgboost.*",
  "optuna", "optuna.*",
  "joblib", "joblib.*",
  # Phase 2.5: shap (and its numba/llvmlite/slicer/cloudpickle transitive
  # deps), plus scipy (used by cross_model_agreement for stats.spearmanr;
  # scipy ships no py.typed marker as of 1.17, scipy-stubs is third-party).
  "shap", "shap.*",
  "numba", "numba.*",
  "llvmlite", "llvmlite.*",
  "slicer", "slicer.*",
  "cloudpickle", "cloudpickle.*",
  "scipy", "scipy.*",
  # Phase 3.1: pdfplumber + tiktoken + jsonschema; jsonschema has
  # third-party stubs (types-jsonschema) but we don't add another dev
  # dep just to type one validator call.
  "pdfplumber", "pdfplumber.*",
  "tiktoken", "tiktoken.*",
  "jsonschema", "jsonschema.*",
  # Phase 3.2: hnswlib (no stubs upstream), rank_bm25 (no stubs),
  # sentence-transformers (transitive transformers + tokenizers stubs
  # exist but aren't comprehensive at the surface we use), FlagEmbedding.
  "hnswlib", "hnswlib.*",
  "rank_bm25", "rank_bm25.*",
  "sentence_transformers", "sentence_transformers.*",
  "FlagEmbedding", "FlagEmbedding.*",
  "transformers", "transformers.*",
  # Phase 3.3: anthropic + openai are optional runtime deps (the
  # MockLLMClient is the CI default so we never install the SDKs in
  # CI). The wrappers lazy-import them inside __init__ so missing
  # packages only surface when someone actually constructs the real
  # client; the mypy ignore lets the static check pass without
  # pinning anthropic/openai versions in pyproject.toml.
  "anthropic", "anthropic.*",
  "openai", "openai.*",
  # Phase 4: langgraph + langgraph-checkpoint emit some types but
  # not enough surface for strict-mode mypy at the call sites we use.
  # Same disposition as the LangChain stack.
  "langgraph", "langgraph.*",
  "langgraph_checkpoint", "langgraph_checkpoint.*",
  # Phase 6: google-genai ships partial typing but uses dynamic
  # attribute access (`response.text`, `usage_metadata`) that our
  # static-check call sites read; same disposition as openai/anthropic.
  "google", "google.*",
  "google.genai", "google.genai.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = [
  "error",
  # IterativeImputer's "Early stopping criterion not reached" at small n
  # (our LODO folds are 600-800 rows) is expected behaviour, not a bug.
  # The imputer still produces sensible imputations; convergence is a
  # nice-to-have, not a correctness condition. Suppressed only for this
  # specific class so any *other* sklearn warning still fails tests.
  "ignore:\\[IterativeImputer\\] Early stopping criterion not reached:sklearn.exceptions.ConvergenceWarning",
  # Phase 2.3b training-driver smoke test: the synthetic smoke dataset
  # is small enough that sklearn's StratifiedKFold (n_splits=5) sometimes
  # finds <5 members in the minority class of an inner CV slice. The
  # warning is informational, not a correctness failure — the inner CV
  # still runs with the available members. Suppressed only for the
  # specific message; any other sklearn UserWarning still fails tests.
  "ignore:The least populated class in y has only:UserWarning:sklearn.model_selection._split",
  # Phase 4 langgraph: JsonPlusSerializer fires a
  # LangChainPendingDeprecationWarning at import time about an
  # `allowed_objects` argument that defaults to "messages" today and
  # will require an explicit value in a future release. Surface it in
  # an upgrade note when langgraph cuts the breaking change; today
  # the default we get is what we want (rich JSON+ serialiser for
  # MemorySaver state).
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

# ------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["cardiorisk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

# ------------------------------------------------------------------- uv
# Force CPU-only torch wheels everywhere. Without this, Linux pulls the
# CUDA wheel by default (~2GB), bloating CI cache and adding nothing for
# inference-only TabPFN use. macOS torch wheels are CPU-only by default;
# this index is identical to the default there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
