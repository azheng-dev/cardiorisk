[project]
name = "cardiorisk-backend"
version = "0.0.0"
description = "FastAPI backend, ML models, and agentic orchestration for CardioRisk Co-Pilot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "CardioRisk Co-Pilot contributors" }]

# Phase 0 keeps deps minimal. New deps are added in their owning phase
# (e.g. fastapi/pydantic in Phase 4, langgraph in Phase 4, shap in Phase 2.5).
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.14",
  "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardiorisk"]

# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
# Strict-ish defaults. Add rules as the codebase grows.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts and have less strict naming.
"tests/**" = ["S101", "N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
plugins = []

[[tool.mypy.overrides]]
# Test code can be a touch looser; we still want types but not strict-mode purity.
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]

# ------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["cardiorisk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
