name: CI

on:
  # Post-merge gate on main only. Pre-PR feedback is delegated to local
  # pre-commit hooks. Restricting push to main avoids the
  # duplicate-cancelled-run trap that poisoned statusCheckRollup
  # when push: ["**"] and pull_request: ["**"] both fired for the
  # same SHA. See ADR-007 §"Workflow change shipped with this ADR".
  push:
    branches: [main]
  # Run on PRs against any base branch, including stacked PRs
  # (e.g. docs/* targeting chore/* before chore/* lands on main).
  pull_request:
    branches: ["**"]

# Cancel in-progress runs on the same branch when a new push lands.
# Use ref_name (branch name, no refs/heads/) on push and head_ref on PR
# events so the push- and PR-triggered runs for the same source branch
# share one group key and only one executes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- gitleaks
  gitleaks:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- python
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  type-check-python:
    name: type-check-python
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Mypy strict
        working-directory: backend
        run: uv run mypy .

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    needs: lint-python
    # hnswlib-0.8.x ships sdist-only on PyPI; uv compiles it from source.
    # The default hnswlib setup.py passes `-march=native`, which bakes in
    # whichever AVX/AVX-512 intrinsics the *build* runner happens to
    # support. uv's wheel cache then persists that built wheel across
    # CI jobs — and a later runner without those intrinsics crashes the
    # interpreter at `import hnswlib` with SIGILL ("Fatal Python error:
    # Illegal instruction"). Two mitigations stacked here:
    #   1. CXXFLAGS/CFLAGS pin the hnswlib build to the x86-64-v3 ISA
    #      (Haswell baseline: AVX2 + SSE4.2 — supported on every Azure
    #      D-series runner GitHub Actions provisions).
    #   2. UV_NO_BINARY_PACKAGE=hnswlib forces a fresh source build
    #      (instead of pulling a stale wheel from the cache that may
    #      have been built with -march=native on a fancier runner).
    env:
      UV_NO_BINARY_PACKAGE: hnswlib
      CFLAGS: "-O3 -march=x86-64-v3"
      CXXFLAGS: "-O3 -march=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Purge any stale hnswlib wheel from uv cache
        # Belt-and-braces: even with UV_NO_BINARY_PACKAGE, an older
        # cached install can shortcut the build. `uv cache clean
        # hnswlib` drops just the hnswlib entry; the rest of the
        # cache is untouched and CI stays fast.
        run: uv cache clean hnswlib || true
      - name: Sync deps
        working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Pytest
        working-directory: backend
        run: uv run pytest -q
      # Smoke-test the EDA notebook end-to-end against the synthetic fixture.
      # No network, no Kaggle credentials. Catches regressions in the data
      # layer that don't show up in unit tests (e.g. notebook-only imports,
      # broken plotting calls, schema mismatches against the parquet writer).
      - name: Build combined.parquet from fixture
        run: uv run --project backend python backend/scripts/build_combined.py --use-fixture
      - name: Execute EDA notebook
        run: uv run --project backend jupytext --execute notebooks/01-eda.py
      # Phase 2.3b: smoke the full training driver end-to-end (1 LODO fold,
      # 1 Optuna trial, 100 bootstrap resamples, all 3 v1 models). Catches
      # regressions in the model wrappers, calibration wiring, and report-
      # writing path that don't surface in unit tests. Runs in ~30s on the
      # GitHub Actions ubuntu-latest runner.
      - name: Smoke train_v1.py --smoke (3 models, 1 LODO fold)
        run: uv run --project backend python backend/scripts/train_v1.py --smoke
      # Phase 2.5: smoke the explainability orchestrator end-to-end (1 LODO
      # fold, smoke KernelSHAP budget = 16 samples, 4 models). Reuses the
      # smoke-trained artefacts from the previous step. Catches regressions
      # in the encoder, KernelSHAP wrapper, TreeSHAP/LR-coef sanity paths,
      # archetype picker, and figure renderer. Runs in ~30s.
      - name: Smoke compute_explanations.py --smoke (4 models, 1 LODO fold)
        run: uv run --project backend python backend/scripts/compute_explanations.py --smoke
      # Phase 2.6: smoke the drift orchestrator end-to-end (1 LODO fold,
      # 4 models, 10 quantile bins). Reuses the smoke-trained artefacts
      # from the train_v1 step. Catches regressions in the PSI/KS
      # primitives, FoldReference build, drift compute, and dashboard
      # renderer. Runs in ~10s on the GitHub Actions ubuntu-latest runner.
      - name: Smoke compute_drift.py --smoke (4 models, 1 LODO fold)
        run: uv run --project backend python backend/scripts/compute_drift.py --smoke
      # Phase 3.1: smoke the corpus ingestion pipeline against the
      # markdown fixture (no PDFs, no network). Exercises parse + all
      # three chunkers + manifest write. Catches regressions in
      # pdfplumber wiring, tiktoken encoding, the heading-aware hybrid
      # chunker, and the eval-set JSON Schema validator. Runs in ~5s.
      - name: Smoke build_corpus.py --use-fixture --strategy all
        run: uv run --project backend python backend/scripts/build_corpus.py --use-fixture --strategy all
      # Phase 3.2: cache the MiniLM-L6 weights between CI runs. The
      # smoke embedder for retrieval is sentence-transformers/all-
      # MiniLM-L6-v2 (~80 MB); without caching, every CI run pays the
      # full HF Hub download. Cache key is just the model name (the
      # weights are immutable on the Hub).
      - name: Cache HuggingFace MiniLM-L6 weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-minilm-l6-v2-v1
      # Phase 3.2: smoke the retrieval index builder + eval orchestrator
      # against the markdown fixture (no PDFs, no full bge-m3 weights,
      # no reranker). Uses sentence-transformers/all-MiniLM-L6-v2 (~80
      # MB) as the smoke embedder. Exercises the full pipeline plumbing:
      # embedder + hnswlib + rank_bm25 + RRF + scorer + report writer +
      # figure renderer. Runs in ~60s on ubuntu-latest after the cache
      # is warm.
      - name: Smoke build_index.py --use-fixture --embedder minilm
        run: uv run --project backend python backend/scripts/build_index.py --use-fixture --strategy all --embedder minilm
      - name: Smoke eval_retrieval.py --smoke --embedder minilm
        run: uv run --project backend python backend/scripts/eval_retrieval.py --smoke --use-fixture --embedder minilm
      # Phase 3.3: smoke the citation-mandatory generator + eval
      # orchestrator end-to-end against the fixture corpus, MockLLM,
      # and Mock NLI. No API keys, no DeBERTa weights. Exercises the
      # parser + suppression policy + scorer + report writer + figure
      # renderer. Reuses the cached MiniLM weights from the previous
      # step. Runs in ~5s on ubuntu-latest.
      - name: Smoke eval_generation.py --smoke
        run: uv run --project backend python backend/scripts/eval_generation.py --smoke --use-fixture --embedder minilm
      # Phase 4: smoke the LangGraph 4-agent orchestration end-to-end (3
      # cases, MockLLM + always-entail NLI + stub retrieval pipeline,
      # in-memory checkpointer, mock risk classifier fallback when no
      # joblib artefact exists). Exercises the full agent surface:
      # triage -> HITL approve -> risk -> HITL approve -> guideline ->
      # HITL approve -> letter -> HITL approve -> END. No API keys,
      # no DeBERTa weights, no joblib artefacts. Runs in ~5s on
      # ubuntu-latest.
      - name: Smoke eval_agents.py --smoke
        run: uv run --project backend python backend/scripts/eval_agents.py --smoke
      # Phase 6: validate the 100-case eval set against the schema and
      # check the generator is reproducible (same seed = same bytes).
      # ~2s on ubuntu-latest. Catches schema drift in cases.jsonl on
      # any PR that touches eval/agents/.
      - name: Validate eval/agents/cases.jsonl against schema
        run: uv run --project backend python backend/scripts/generate_agent_cases.py --check-only

  # ------------------------------------------------------------ phase-6 eval gate
  agent-eval-mock:
    name: agent-eval-mock (regression gate)
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend deps
        run: uv sync --project backend --frozen
      # Phase 6: full 100-case mock pipeline (MockLLMClient + always-entail
      # NLI + stub retrieval + MockJudge) and gate against
      # reports/v1/agents/baseline_mock.json with the ±2 pp tolerance
      # documented in ADR-019 §5. The full run takes ~2 minutes on
      # ubuntu-latest; no API keys, no model weights, no DeBERTa. This
      # job is required on main (branch protection adds it after the
      # PR that introduces it lands).
      - name: Run mock-pipeline agent eval + regression gate
        env:
          OMP_NUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          uv run --project backend python backend/scripts/eval_agents.py \
            --reports-dir /tmp/cr_eval --figures-dir /tmp/cr_eval_fig \
            --regression-check reports/v1/agents/baseline_mock.json

  # ---------------------------------------------------------------- typescript
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Biome check
        working-directory: frontend
        run: pnpm exec biome check .

  type-check-ts:
    name: type-check-ts
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: frontend
        run: pnpm exec tsc --noEmit

  test-ts:
    name: test-ts
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Vitest
        working-directory: frontend
        run: pnpm test --run
      # Phase 5.1: ensure the brand preview + landing pages stay
      # buildable in CI. `next build` exercises both the static
      # generator and the Tailwind v4 PostCSS pipeline; it caught a
      # regression class that vitest + tsc miss (e.g. broken `next/font`
      # wiring, invalid `@theme` syntax). ~20s on ubuntu-latest.
      - name: Next.js build
        working-directory: frontend
        run: pnpm build

  # Phase 5.2: axe accessibility gate over the Ladle catalog. Builds the
  # static catalog (~5s after a warm pnpm cache) and walks every story
  # x {light, dark} with @axe-core/playwright, failing on any serious or
  # critical violation. Documented exemptions live in
  # `frontend/tests/axe/catalog.spec.ts` (currently: cmdk's
  # aria-required-children/parent rules, manually verified with
  # VoiceOver). Runs in ~60s on ubuntu-latest after Playwright caches
  # warm.
  axe-ts:
    name: axe-ts
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Cache the Playwright browser binaries between runs. Keyed on the
      # @playwright/test version pinned in pnpm-lock.yaml so a bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Ladle catalog
        working-directory: frontend
        run: pnpm ladle:build
      - name: axe over catalog
        working-directory: frontend
        env:
          CI: "true"
        run: pnpm axe

  # Phase 5.4: axe accessibility gate over the 5 Phase-5.3 workflow
  # routes themselves (composed screens, not isolated primitives). Boots
  # the Next.js production build with NEXT_PUBLIC_AGENT_MOCK=true so the
  # mock case populates every screen deterministically, then walks each
  # route through @axe-core/playwright in both colorScheme: "light" and
  # colorScheme: "dark". Documented exemptions match the Ladle gate
  # (cmdk aria-required-children/parent). Runs in ~60s after caches warm.
  axe-pages:
    name: axe-pages
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: axe over screens
        working-directory: frontend
        env:
          CI: "true"
        run: pnpm axe:pages
